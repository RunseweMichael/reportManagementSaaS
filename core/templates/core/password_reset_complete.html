{% extends "core/base.html" %}

{% block title %}Password Changed - Parach ICT Academy{% endblock %}

{% block extra_style %}
<style>
    .password-success-page {
        min-height: calc(100vh - 60px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .password-success-card {
        width: 100%;
        max-width: 450px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px 36px;
        text-align: center;
        box-shadow: var(--shadow);
    }

    .success-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(110, 231, 183, 0.12);
        border: 1px solid rgba(110, 231, 183, 0.3);

        color: var(--accent);
        font-size: 1.7rem;
        font-weight: 700;
    }

    .password-success-card h2 {
        font-size: 1.5rem;
        margin-bottom: 12px;
    }

    .password-success-card p {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.7;
        margin-bottom: 26px;
    }

    .password-success-card .btn {
        justify-content: center;
        min-width: 130px;
    }
</style>
{% endblock %}


{% block content %}

<div class="password-success-page">

    <div class="password-success-card">

        <div class="success-icon">
            ✓
        </div>

        <h2>Password Changed</h2>

        <p>
            Your password has been successfully changed.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary">
            Login
        </a>

    </div>

</div>

{% endblock %}
