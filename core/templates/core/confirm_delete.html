<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirm Delete - Parach ICT Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--surface:#13161d;--surface2:#1a1e28;--border:#252a38;--accent:#6ee7b7;--accent2:#818cf8;--warn:#f87171;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:var(--surface);border:1px solid rgba(248,113,113,.3);border-radius:16px;padding:40px;max-width:420px;width:100%;text-align:center}
.icon{font-size:2.5rem;margin-bottom:16px}
h2{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:8px}
p{color:var(--muted);font-size:.9rem;margin-bottom:28px;line-height:1.6}
.obj{font-weight:600;color:var(--text)}
.btns{display:flex;gap:12px;justify-content:center}
.btn{padding:10px 22px;border-radius:8px;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:700;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn-danger{background:rgba(248,113,113,.2);color:var(--warn);border:1px solid rgba(248,113,113,.3)}
.btn-danger:hover{background:rgba(248,113,113,.3)}
.btn-ghost{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text)}
</style>
</head>
<body>
<div class="box">
  <div class="icon">⚠️</div>
  <h2>Confirm Delete</h2>
  <p>Are you sure you want to delete <span class="obj">{{ obj }}</span>?<br>This action cannot be undone.</p>
  <div class="btns">
    <form method="post" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
    </form>
    <a href="{% url back %}" class="btn btn-ghost">Cancel</a>
  </div>
</div>
</body>
</html>
