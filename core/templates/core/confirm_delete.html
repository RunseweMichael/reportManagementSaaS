<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirm Delete - Parach ICT Academy</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0d0f14;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: #252a38;

    --accent: #6ee7b7;
    --accent2: #818cf8;
    --warn: #f87171;

    --text: #e2e8f0;
    --muted: #64748b;

    --shadow: 0 20px 60px rgba(0, 0, 0, .45);
    --radius: 16px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: 'DM Sans', sans-serif;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(248, 113, 113, .055),
            transparent 35%
        ),
        var(--bg);
    color: var(--text);

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;
}

/* =========================
   DELETE CARD
========================= */

.delete-wrapper {
    width: 100%;
    max-width: 440px;
}

.box {
    position: relative;

    background: var(--surface);
    border: 1px solid rgba(248, 113, 113, .25);
    border-radius: var(--radius);

    padding: 38px 36px 34px;

    text-align: center;

    box-shadow: var(--shadow);

    overflow: hidden;
}

/* subtle top accent */
.box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 3px;

    background: linear-gradient(
        90deg,
        transparent,
        var(--warn),
        transparent
    );

    opacity: .8;
}

/* =========================
   ICON
========================= */

.icon-wrapper {
    width: 68px;
    height: 68px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(248, 113, 113, .08);
    border: 1px solid rgba(248, 113, 113, .18);

    box-shadow:
        0 0 0 8px rgba(248, 113, 113, .025);
}

.icon {
    font-size: 1.8rem;
    line-height: 1;
}

/* =========================
   TEXT
========================= */

h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.45rem;
    font-weight: 800;

    color: var(--text);

    margin-bottom: 10px;
    letter-spacing: -.02em;
}

.description {
    color: var(--muted);
    font-size: .88rem;

    line-height: 1.7;

    margin-bottom: 26px;
}

.obj {
    display: inline-block;

    max-width: 100%;

    color: var(--text);
    font-weight: 600;

    word-break: break-word;
}

.warning-text {
    display: block;

    margin-top: 5px;

    color: rgba(248, 113, 113, .8);
    font-size: .78rem;
}

/* =========================
   ACTIONS
========================= */

.btns {
    display: flex;
    gap: 10px;

    justify-content: center;

    width: 100%;
}

.btn {
    min-height: 42px;

    padding: 10px 18px;

    border-radius: 9px;

    font-family: 'DM Sans', sans-serif;
    font-size: .82rem;
    font-weight: 600;

    border: 1px solid transparent;

    cursor: pointer;
    text-decoration: none;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn:active {
    transform: translateY(0);
}

/* Delete */

.btn-danger {
    background: rgba(248, 113, 113, .13);
    color: var(--warn);

    border-color: rgba(248, 113, 113, .28);
}

.btn-danger:hover {
    background: rgba(248, 113, 113, .2);

    border-color: rgba(248, 113, 113, .45);

    box-shadow: 0 6px 20px rgba(248, 113, 113, .1);
}

/* Cancel */

.btn-ghost {
    background: var(--surface2);
    color: var(--muted);

    border-color: var(--border);
}

.btn-ghost:hover {
    background: #202431;
    color: var(--text);

    border-color: #323849;
}

/* =========================
   FOCUS
========================= */

.btn:focus-visible {
    outline: 2px solid var(--accent2);
    outline-offset: 3px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    body {
        padding: 18px;
    }

    .box {
        padding: 32px 22px 26px;
    }

    h2 {
        font-size: 1.3rem;
    }

    .description {
        font-size: .84rem;
    }

    .btns {
        flex-direction: column-reverse;
    }

    .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="delete-wrapper">

    <div class="box">

        <div class="icon-wrapper">
            <div class="icon">⚠</div>
        </div>

        <h2>Confirm Delete</h2>

        <p class="description">
            Are you sure you want to delete
            <span class="obj">{{ obj }}</span>?

            <span class="warning-text">
                This action cannot be undone.
            </span>
        </p>

        <div class="btns">

            <form method="post" style="display:inline">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    <span>Delete</span>
                </button>
            </form>

            <a href="{% url back %}" class="btn btn-ghost">
                <span>Cancel</span>
            </a>

        </div>

    </div>

</div>

</body>
</html>
