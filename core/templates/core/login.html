<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Parach ICT Academy - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0d0f14;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: #252a38;

    --accent: #6ee7b7;
    --accent2: #818cf8;
    --warn: #f87171;

    --text: #e2e8f0;
    --muted: #64748b;

    --shadow: 0 20px 60px rgba(0, 0, 0, .45);
    --radius: 16px;
}

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
}

body {
    font-family: 'DM Sans', sans-serif;

    background: var(--bg);
    color: var(--text);

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    position: relative;
    overflow: hidden;
}

/* =========================
   BACKGROUND GLOWS
========================= */

.glow,
.glow2 {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(10px);
}

.glow {
    width: 600px;
    height: 600px;

    background:
        radial-gradient(
            circle,
            rgba(110, 231, 183, .07),
            transparent 68%
        );

    top: -180px;
    right: -160px;
}

.glow2 {
    width: 500px;
    height: 500px;

    background:
        radial-gradient(
            circle,
            rgba(129, 140, 248, .065),
            transparent 68%
        );

    bottom: -220px;
    left: -180px;
}

/* =========================
   LOGIN CARD
========================= */

.login-wrapper {
    width: 100%;
    max-width: 420px;

    position: relative;
    z-index: 1;
}

.login-box {
    position: relative;

    background: rgba(19, 22, 29, .96);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    padding: 38px 36px 30px;

    box-shadow: var(--shadow);

    overflow: hidden;
}

/* subtle top accent */
.login-box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        var(--accent2),
        transparent
    );

    opacity: .8;
}

/* =========================
   BRAND
========================= */

.brand {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-family: 'Syne', sans-serif;

    font-size: 1.9rem;
    font-weight: 800;

    line-height: 1.15;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    margin-bottom: 8px;
}

.tagline {
    color: var(--muted);

    font-size: .82rem;

    line-height: 1.55;

    max-width: 300px;
    margin: 0 auto;
}

/* =========================
   FORM
========================= */

.login-form {
    display: flex;
    flex-direction: column;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;

    font-size: .73rem;

    color: var(--muted);

    font-family: 'Syne', sans-serif;
    font-weight: 700;
    letter-spacing: .06em;

    margin-bottom: 8px;
}

input {
    width: 100%;

    background: var(--surface2);

    border: 1px solid var(--border);

    border-radius: 9px;

    padding: 12px 13px;

    color: var(--text);

    font-family: 'DM Sans', sans-serif;
    font-size: .88rem;

    outline: none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

input::placeholder {
    color: var(--muted);
    opacity: .7;
}

input:hover {
    border-color: #303647;
}

input:focus {
    border-color: var(--accent);

    background: var(--surface);

    box-shadow:
        0 0 0 3px rgba(110, 231, 183, .1);
}

/* =========================
   SIGN IN BUTTON
========================= */

.btn {
    width: 100%;

    min-height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 11px 16px;

    margin-top: 3px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            #34d399
        );

    color: #07110d;

    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: .88rem;

    border: none;
    border-radius: 9px;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

.btn:hover {
    opacity: .94;

    transform: translateY(-1px);

    box-shadow:
        0 8px 24px rgba(110, 231, 183, .14);
}

.btn:active {
    transform: translateY(0);
}

.btn:focus-visible {
    outline: 2px solid var(--accent2);
    outline-offset: 3px;
}

/* =========================
   ERROR / MESSAGES
========================= */

.error {
    display: flex;
    align-items: flex-start;
    gap: 9px;

    background: rgba(248, 113, 113, .08);

    border: 1px solid rgba(248, 113, 113, .23);

    border-radius: 9px;

    padding: 11px 13px;

    color: var(--warn);

    font-size: .8rem;
    line-height: 1.5;

    margin-bottom: 17px;
}

.error::before {
    content: "!";
    
    flex: 0 0 auto;

    width: 18px;
    height: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(248, 113, 113, .14);

    font-size: .7rem;
    font-weight: 800;
}

/* =========================
   FORGOT PASSWORD
========================= */

.forgot-password {
    display: block;

    text-align: center;

    margin-top: 17px;

    font-size: .79rem;

    color: var(--muted);

    text-decoration: none;

    transition:
        color .2s ease;
}

.forgot-password:hover {
    color: var(--accent);
}

/* =========================
   REGISTER LINK
========================= */

.register-link {
    text-align: center;

    margin-top: 23px;
    padding-top: 20px;

    border-top: 1px solid var(--border);

    font-size: .8rem;

    color: var(--muted);

    line-height: 1.6;
}

.register-link a {
    color: var(--accent);

    font-weight: 600;

    text-decoration: none;

    transition:
        color .2s ease;
}

.register-link a:hover {
    color: var(--text);
    text-decoration: underline;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {

    body {
        padding: 18px;
        overflow: auto;
    }

    .login-box {
        padding: 32px 22px 27px;
    }

    .logo {
        font-size: 1.65rem;
    }

    .tagline {
        font-size: .78rem;
    }
}

/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    input,
    .btn,
    .forgot-password,
    .register-link a {
        transition: none;
    }
}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow2"></div>


<div class="login-wrapper">

    <div class="login-box">

        <!-- Brand -->
        <div class="brand">

            <div class="logo">
                Parach ICT Academy
            </div>

            <div class="tagline">
                Tutor management platform — sign in to continue
            </div>

        </div>


        <!-- Messages -->
        {% if messages %}
            {% for msg in messages %}
                <div class="error">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}


        <!-- Login Form -->
        <form method="post" class="login-form">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    required
                >

            </div>


            <button type="submit" class="btn">
                Sign In →
            </button>

        </form>


        <!-- Password Reset -->
        <a
            href="{% url 'password_reset' %}"
            class="forgot-password"
        >
            Forgot your password?
        </a>


        <!-- Registration -->
        <div class="register-link">

            New tutor?

            <a href="{% url 'tutor_register' %}">
                Create an account
            </a>

        </div>

    </div>

</div>

</body>
</html>
