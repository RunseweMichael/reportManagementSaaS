<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parach ICT Academy - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--surface:#13161d;--surface2:#1a1e28;--border:#252a38;--accent:#6ee7b7;--accent2:#818cf8;--text:#e2e8f0;--muted:#64748b;--warn:#f87171}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.glow{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(110,231,183,.06),transparent 70%);top:-100px;right:-100px;pointer-events:none}
.glow2{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(129,140,248,.06),transparent 70%);bottom:-50px;left:-50px;pointer-events:none}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:400px;position:relative}
.logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.tagline{font-size:.82rem;color:var(--muted);margin-bottom:32px}
label{display:block;font-size:.78rem;color:var(--muted);font-family:'Syne',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;transition:.15s;margin-bottom:16px}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,231,183,.1)}
.btn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),#34d399);color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;border:none;border-radius:8px;cursor:pointer;transition:.15s;margin-top:8px}
.btn:hover{opacity:.9}
.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:10px 14px;color:var(--warn);font-size:.85rem;margin-bottom:16px}
</style>
</head>
<body>
<div class="glow"></div>
<div class="glow2"></div>
<div class="login-box">
  <div class="logo">Parach ICT Academy</div>
  <div class="tagline">Tutor management platform — sign in to continue</div>
  {% if messages %}
    {% for msg in messages %}<div class="error">{{ msg }}</div>{% endfor %}
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username</label>
    <input type="text" name="username" autocomplete="username" placeholder="Enter your username" required>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
    <button type="submit" class="btn">Sign In →</button>
  </form>
  <div style="text-align:center;margin-top:16px;font-size:.875rem;color:var(--muted)">
  New tutor? <a href="{% url 'tutor_register' %}" style="color:var(--accent)">Create an account</a>
</div>
</div>

</body>
</html>
