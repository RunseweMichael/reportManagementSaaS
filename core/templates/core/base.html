<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Parach ICT Academy{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap"
          rel="stylesheet">

    <style>

        /* =========================================================
           ROOT / DESIGN SYSTEM
        ========================================================= */

        :root {

            --bg: #0b0e13;

            --surface: #12161e;

            --surface2: #191e28;

            --surface3: #202633;

            --border: #272d3a;

            --border-light: #343c4c;

            --accent: #6ee7b7;

            --accent2: #818cf8;

            --accent3: #fb923c;

            --warn: #f87171;

            --text: #ffffff;

            --text-soft: #ffffff;

            --muted: #ffffff;

            --online: #34d399;

            --physical: #a78bfa;

            --radius: 12px;

            --radius-sm: 8px;

            --shadow:
                0 6px 25px rgba(0, 0, 0, .30);

            --shadow-lg:
                0 15px 50px rgba(0, 0, 0, .40);

            --font: 'Montserrat', sans-serif;

            --body-font: 'Roboto', sans-serif;

            --sidebar-w: 240px;

            --sidebar-w-collapsed: 72px;

            --transition:
                .2s cubic-bezier(.4, 0, .2, 1);
        }


        /* =========================================================
           LIGHT THEME
        ========================================================= */

        html[data-theme="light"] {

            --bg: #f6f7f9;

            --surface: #ffffff;

            --surface2: #f1f3f6;

            --surface3: #e8ebf0;

            --border: #e1e5eb;

            --border-light: #d3d8e0;

            --accent: #10b981;

            --accent2: #6366f1;

            --accent3: #f97316;

            --warn: #ef4444;

            --text: #000000;

            --text-soft: #000000;

            --muted: #000000;

            --online: #10b981;

            --physical: #8b5cf6;

            --shadow:
                0 6px 25px rgba(15, 23, 42, .07);

            --shadow-lg:
                0 15px 50px rgba(15, 23, 42, .10);
        }


        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {

            box-sizing: border-box;

            margin: 0;

            padding: 0;
        }

        html {

            font-size: 15px;

            -webkit-font-smoothing: antialiased;

            scroll-behavior: smooth;
        }

        body {

            font-family: var(--font);

            background: var(--bg);

            color: var(--text);

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            transition:
                background .2s ease,
                color .2s ease;
        }

        a {

            color: inherit;

            text-decoration: none;
        }

        h1,
        h2,
        h3,
        h4,
        h5 {

            font-family: var(--font);

            font-weight: 700;

            line-height: 1.2;
        }

        button,
        input,
        select,
        textarea {

            font-family: inherit;
        }


        /* =========================================================
           SCROLLBAR
        ========================================================= */

        ::-webkit-scrollbar {

            width: 7px;

            height: 7px;
        }

        ::-webkit-scrollbar-track {

            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {

            background: var(--border-light);

            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {

            background: var(--muted);
        }


        /* =========================================================
           LAYOUT
        ========================================================= */

        .app-layout {

            display: flex;

            min-height: 100vh;
        }

        .main-content {

            margin-left: var(--sidebar-w);

            flex: 1;

            min-width: 0;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            transition:
                margin-left var(--transition);
        }

        .page-body {

            padding: 28px;

            flex: 1;

            width: 100%;
        }


        /* =========================================================
           TOP BAR
        ========================================================= */

        .top-bar {

            height: 60px;

            background:
                rgba(19, 22, 29, .92);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border-bottom:
                1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            position: sticky;

            top: 0;

            z-index: 50;

            transition:
                background .2s ease,
                border-color .2s ease;
        }

        html[data-theme="light"] .top-bar {

            background:
                rgba(255, 255, 255, .92);
        }


        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {

            --sb-bg: #12161d;

            --sb-bg2: #1a1f29;

            --sb-border: #252b37;

            --sb-text: #ffffff;

            --sb-muted: #ffffff;

            width: var(--sidebar-w);

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(110, 231, 183, .055),
                    transparent 32%
                ),
                linear-gradient(
                    180deg,
                    #131820 0%,
                    #0f131a 100%
                );

            border-right:
                1px solid var(--sb-border);

            color: var(--sb-text);

            display: flex;

            flex-direction: column;

            position: fixed;

            top: 0;

            left: 0;

            z-index: 100;

            overflow-x: hidden;

            transition:
                width var(--transition);

            box-shadow:
                6px 0 25px rgba(0, 0, 0, .12);
        }


        /* =========================================================
           SIDEBAR LOGO
        ========================================================= */

        .sidebar-logo {

            padding:
                20px 20px 14px;

            border-bottom:
                1px solid var(--sb-border);

            white-space: nowrap;
        }

        .sidebar-logo .logo-text {

            font-family: var(--font);

            font-size: 1.3rem;

            font-weight: 800;

            letter-spacing: -.03em;

            color: var(--sb-text);
        }

        .sidebar-logo .logo-sub {

            font-size: .68rem;

            color: var(--sb-muted);

            margin-top: 3px;

            text-transform: none;

            letter-spacing: .09em;

            font-weight: 500;
        }


        /* =========================================================
           SIDEBAR NAV
        ========================================================= */

        .sidebar-nav {

            padding:
                14px 10px;

            flex: 1;

            overflow-y: auto;
        }

        .nav-section {

            margin-bottom: 17px;
        }

        .nav-label {

            font-size: .66rem;

            color: var(--sb-muted);

            text-transform: none;

            letter-spacing: .11em;

            padding:
                0 10px 7px;

            font-family: var(--font);

            white-space: nowrap;

            font-weight: 600;
        }

        .nav-item {

            position: relative;

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                9px 10px;

            border-radius:
                var(--radius-sm);

            color:
                var(--sb-muted);

            font-size:
                .86rem;

            font-weight:
                500;

            transition:
                background .15s ease,
                color .15s ease,
                transform .15s ease;

            cursor: pointer;

            margin-bottom: 3px;

            white-space: nowrap;

            overflow: hidden;
        }

        .nav-item:hover {

            background:
                rgba(255, 255, 255, .045);

            color:
                var(--sb-text);

            transform:
                translateX(2px);
        }

        .nav-item.active {

            background:
                linear-gradient(
                    135deg,
                    rgba(110, 231, 183, .14),
                    rgba(129, 140, 248, .08)
                );

            color:
                var(--sb-text);

            border:
                1px solid
                rgba(110, 231, 183, .16);

            box-shadow:
                inset 0 0 20px
                rgba(110, 231, 183, .025);
        }

        .nav-item.active::before {

            content: "";

            position: absolute;

            left: 0;

            top: 7px;

            bottom: 7px;

            width: 3px;

            border-radius: 5px;

            background:
                var(--accent);
        }

        .nav-item .icon {

            width: 16px;

            text-align: center;

            font-size: .95rem;

            flex-shrink: 0;
        }


        /* =========================================================
           SIDEBAR FOOTER
        ========================================================= */

        .sidebar-footer {

            padding: 14px;

            border-top:
                1px solid var(--sb-border);

            white-space: nowrap;

            overflow: hidden;
        }

        .user-pill {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 8px;

            border-radius:
                var(--radius-sm);

            background:
                rgba(255, 255, 255, .035);

            border:
                1px solid
                rgba(255, 255, 255, .025);
        }

        .user-avatar {

            width: 32px;

            height: 32px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6ee7b7,
                    #818cf8
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: var(--font);

            font-weight: 700;

            font-size: .85rem;

            color: #000;

            flex-shrink: 0;

            box-shadow:
                0 0 0 3px
                rgba(110, 231, 183, .06);
        }

        .user-info {

            flex: 1;

            min-width: 0;
        }

        .user-name {

            font-size: .82rem;

            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            color: var(--sb-text);
        }

        .user-role {

            font-size: .7rem;

            color: var(--sb-muted);

            margin-top: 2px;
        }


        /* =========================================================
           COLLAPSED SIDEBAR
        ========================================================= */

        body.sidebar-collapsed .sidebar {

            width:
                var(--sidebar-w-collapsed);
        }

        body.sidebar-collapsed .main-content {

            margin-left:
                var(--sidebar-w-collapsed);
        }

        body.sidebar-collapsed .sidebar-logo {

            text-align: center;

            padding:
                20px 4px 12px;
        }

        body.sidebar-collapsed .sidebar-logo .logo-text,
        body.sidebar-collapsed .sidebar-logo .logo-sub {

            display: none;
        }

        body.sidebar-collapsed .nav-label {

            display: none;
        }

        body.sidebar-collapsed .nav-item {

            justify-content: center;

            font-size: 0;

            padding:
                10px 0;
        }

        body.sidebar-collapsed .nav-item .icon {

            font-size:
                1.05rem;
        }

        body.sidebar-collapsed .user-pill {

            justify-content: center;

            padding:
                8px 0;

            background:
                transparent;

            border: none;
        }

        body.sidebar-collapsed .user-info {

            display: none;
        }

        body.sidebar-collapsed .sidebar-footer .btn-ghost {

            display: none;
        }


        /* =========================================================
           CARDS
        ========================================================= */

        .card {

            background:
                linear-gradient(
                    145deg,
                    var(--surface),
                    var(--surface2)
                );

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            padding:
                20px;

            box-shadow:
                0 3px 18px
                rgba(0, 0, 0, .08);

            transition:
                background .2s ease,
                border-color .2s ease,
                box-shadow .2s ease,
                transform .2s ease;
        }

        .card:hover {

            border-color:
                var(--border-light);

            box-shadow:
                var(--shadow);
        }

        .card-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                16px;
        }

        .card-title {

            font-family:
                var(--font);

            font-size:
                1rem;

            font-weight:
                700;
        }


        /* =========================================================
           STAT CARDS
        ========================================================= */

        .stat-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap:
                14px;

            margin-bottom:
                24px;
        }

        .stat-card {

            background:
                linear-gradient(
                    145deg,
                    var(--surface),
                    var(--surface2)
                );

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            padding:
                18px;

            position:
                relative;

            overflow:
                hidden;

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .2s ease,
                box-shadow .2s ease;
        }

        .stat-card:hover {

            transform:
                translateY(-2px);

            border-color:
                var(--border-light);

            box-shadow:
                var(--shadow);
        }

        .stat-card::before {

            content: '';

            position: absolute;

            width: 120px;

            height: 120px;

            right: -50px;

            top: -50px;

            opacity: .06;

            background:
                var(--glow-color, var(--accent));

            border-radius:
                50%;
        }

        .stat-label {

            font-size:
                .72rem;

            color:
                var(--muted);

            text-transform:
                none;

            letter-spacing:
                .08em;

            margin-bottom:
                8px;

            font-weight:
                600;
        }

        .stat-value {

            font-family:
                var(--font);

            font-size:
                2rem;

            font-weight:
                800;

            line-height:
                1;

            color:
                var(--text);
        }

        .stat-sub {

            font-size:
                .75rem;

            color:
                var(--muted);

            margin-top:
                5px;
        }


        /* =========================================================
           BADGES
        ========================================================= */

        .badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                4px;

            padding:
                3px 10px;

            border-radius:
                100px;

            font-size:
                .72rem;

            font-weight:
                600;

            font-family:
                var(--font);

            text-transform:
                none;

            letter-spacing:
                .05em;

            white-space:
                nowrap;
        }

        .badge-online {

            background:
                rgba(52, 211, 153, .15);

            color:
                var(--text);

            border:
                1px solid
                rgba(52, 211, 153, .25);
        }

        .badge-physical {

            background:
                rgba(167, 139, 250, .15);

            color:
                var(--text);

            border:
                1px solid
                rgba(167, 139, 250, .25);
        }

        .badge-present {

            background:
                rgba(110, 231, 183, .15);

            color:
                var(--text);

            border:
                1px solid
                rgba(110, 231, 183, .25);
        }

        .badge-absent {

            background:
                rgba(248, 113, 113, .15);

            color:
                var(--text);

            border:
                1px solid
                rgba(248, 113, 113, .25);
        }

        .badge-draft {

            background:
                rgba(100, 116, 139, .15);

            color:
                var(--text);

            border:
                1px solid
                rgba(100, 116, 139, .25);
        }

        .badge-submitted {

            background:
                rgba(251, 146, 60, .15);

            color:
                var(--text);

            border:
                1px solid
                rgba(251, 146, 60, .25);
        }

        .badge-reviewed {

            background:
                rgba(110, 231, 183, .15);

            color:
                var(--text);

            border:
                1px solid
                rgba(110, 231, 183, .25);
        }

        .badge-active {

            background:
                rgba(110, 231, 183, .12);

            color:
                var(--text);

            border:
                1px solid
                rgba(110, 231, 183, .2);
        }

        .badge-inactive {

            background:
                rgba(248, 113, 113, .12);

            color:
                var(--text);

            border:
                1px solid
                rgba(248, 113, 113, .2);
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .btn {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            padding:
                8px 16px;

            border-radius:
                var(--radius-sm);

            font-family:
                var(--font);

            font-size:
                .82rem;

            font-weight:
                600;

            border:
                none;

            cursor:
                pointer;

            transition:
                transform .15s ease,
                opacity .15s ease,
                border-color .15s ease,
                background .15s ease,
                box-shadow .15s ease;

            text-decoration:
                none;

            letter-spacing:
                .02em;
        }

        .btn:hover {

            transform:
                translateY(-1px);
        }

        .btn:active {

            transform:
                translateY(0);
        }

        .btn-primary {

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #34d399
                );

            color:
                #000;

            box-shadow:
                0 4px 12px
                rgba(52, 211, 153, .12);
        }

        .btn-primary:hover {

            opacity:
                .92;

            box-shadow:
                0 6px 18px
                rgba(52, 211, 153, .18);
        }

        .btn-secondary {

            background:
                var(--surface2);

            color:
                var(--text);

            border:
                1px solid var(--border);
        }

        .btn-secondary:hover {

            border-color:
                var(--accent);

            color:
                var(--accent);
        }

        .btn-danger {

            background:
                rgba(248, 113, 113, .15);

            color:
                var(--warn);

            border:
                1px solid
                rgba(248, 113, 113, .25);
        }

        .btn-danger:hover {

            background:
                rgba(248, 113, 113, .25);
        }

        .btn-sm {

            padding:
                5px 11px;

            font-size:
                .76rem;
        }

        .btn-ghost {

            background:
                transparent;

            color:
                var(--sb-muted, var(--muted));

            border:
                1px solid
                var(--sb-border, var(--border));
        }

        .btn-ghost:hover {

            color:
                var(--sb-text, var(--text));

            border-color:
                var(--sb-muted, var(--muted));
        }


        /* =========================================================
           TABLES
        ========================================================= */

        .table-wrap {

            overflow-x:
                auto;

            border-radius:
                var(--radius);

            border:
                1px solid var(--border);

            background:
                var(--surface);

            box-shadow:
                0 3px 18px
                rgba(0, 0, 0, .08);
        }

        table {

            width:
                100%;

            border-collapse:
                collapse;

            font-size:
                .875rem;
        }

        th {

            background:
                var(--surface2);

            color:
                var(--muted);

            font-family:
                var(--font);

            font-size:
                .72rem;

            text-transform:
                none;

            letter-spacing:
                .08em;

            padding:
                12px 16px;

            text-align:
                left;

            font-weight:
                600;

            border-bottom:
                1px solid var(--border);

            white-space:
                nowrap;
        }

        td {

            padding:
                12px 16px;

            border-bottom:
                1px solid var(--border);

            vertical-align:
                middle;
        }

        tr:last-child td {

            border-bottom:
                none;
        }

        tbody tr {

            transition:
                background .15s ease;
        }

        tr:hover td {

            background:
                rgba(127, 127, 127, .045);
        }


        /* =========================================================
           FORMS
        ========================================================= */

        .form-wrap {

            max-width:
                640px;
        }

        .form-group {

            margin-bottom:
                18px;
        }

        .form-label {

            display:
                block;

            font-size:
                .8rem;

            color:
                var(--muted);

            margin-bottom:
                6px;

            font-family:
                var(--font);

            font-weight:
                600;

            text-transform:
                none;

            letter-spacing:
                .06em;
        }

        input[type=text],
        input[type=email],
        input[type=password],
        input[type=date],
        input[type=time],
        input[type=number],
        select,
        textarea {

            width:
                100%;

            background:
                var(--surface2);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius-sm);

            padding:
                9px 12px;

            color:
                var(--text);

            font-family:
                var(--font);

            font-size:
                .9rem;

            transition:
                border-color .15s ease,
                box-shadow .15s ease,
                background .15s ease;

            outline:
                none;
        }

        input:hover,
        select:hover,
        textarea:hover {

            border-color:
                var(--border-light);
        }

        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                var(--accent);

            box-shadow:
                0 0 0 3px
                rgba(110, 231, 183, .1);

            background:
                var(--surface);
        }

        textarea {

            resize:
                vertical;

            min-height:
                80px;
        }

        select {

            cursor:
                pointer;
        }

        .checkbox-list {

            display:
                flex;

            flex-direction:
                column;

            gap:
                6px;

            max-height:
                200px;

            overflow-y:
                auto;

            padding:
                10px;

            background:
                var(--surface2);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius-sm);
        }

        .checkbox-list label {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            font-size:
                .875rem;

            cursor:
                pointer;

            padding:
                3px 0;
        }

        .form-row {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                16px;
        }

        .form-actions {

            display:
                flex;

            gap:
                10px;

            margin-top:
                24px;

            padding-top:
                20px;

            border-top:
                1px solid var(--border);
        }


        /* =========================================================
           MESSAGES
        ========================================================= */

        .messages {

            margin-bottom:
                18px;
        }

        .message {

            padding:
                10px 16px;

            border-radius:
                var(--radius-sm);

            font-size:
                .875rem;

            margin-bottom:
                6px;

            border-left:
                3px solid;

            animation:
                messageIn .2s ease;
        }

        @keyframes messageIn {

            from {

                opacity:
                    0;

                transform:
                    translateY(-5px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }

        .message.success {

            background:
                rgba(110, 231, 183, .1);

            border-color:
                var(--accent);

            color:
                var(--accent);
        }

        .message.error {

            background:
                rgba(248, 113, 113, .1);

            border-color:
                var(--warn);

            color:
                var(--warn);
        }

        .message.warning {

            background:
                rgba(251, 146, 60, .1);

            border-color:
                var(--accent3);

            color:
                var(--accent3);
        }


        /* =========================================================
           MISC / UTILITIES
        ========================================================= */

        .page-title {

            font-size:
                1.6rem;

            font-weight:
                800;

            margin-bottom:
                4px;

            letter-spacing:
                -.025em;
        }

        .page-sub {

            color:
                var(--muted);

            font-size:
                .875rem;

            margin-bottom:
                24px;
        }

        .flex {
            display: flex;
        }

        .flex-1 {
            flex: 1;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-2 {
            gap: 8px;
        }

        .gap-3 {
            gap: 12px;
        }

        .gap-4 {
            gap: 16px;
        }

        .mb-4 {
            margin-bottom: 16px;
        }

        .mb-6 {
            margin-bottom: 24px;
        }

        .grid-2 {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                16px;
        }

        .grid-3 {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                16px;
        }

        .text-muted {

            color:
                var(--muted);
        }

        .text-sm {

            font-size:
                .82rem;
        }

        .dot {

            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            flex-shrink:
                0;
        }

        .dot-green {

            background:
                var(--online);

            box-shadow:
                0 0 7px
                rgba(52, 211, 153, .35);
        }

        .dot-purple {

            background:
                var(--physical);
        }

        .dot-gray {

            background:
                var(--muted);
        }

        .tag {

            display:
                inline-block;

            background:
                var(--surface2);

            border:
                1px solid var(--border);

            border-radius:
                4px;

            padding:
                2px 8px;

            font-size:
                .72rem;

            color:
                var(--muted);
        }


        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .empty-state {

            text-align:
                center;

            padding:
                48px 24px;

            color:
                var(--muted);
        }

        .empty-state .icon {

            font-size:
                2.5rem;

            margin-bottom:
                12px;

            opacity:
                .7;
        }

        .empty-state p {

            font-size:
                .9rem;
        }


        /* =========================================================
           FILTER BAR
        ========================================================= */

        .filter-bar {

            display:
                flex;

            gap:
                10px;

            margin-bottom:
                20px;

            flex-wrap:
                wrap;

            align-items:
                center;
        }

        .filter-bar a {

            padding:
                6px 14px;

            border-radius:
                100px;

            border:
                1px solid var(--border);

            font-size:
                .8rem;

            color:
                var(--text);

            font-family:
                var(--font);

            font-weight:
                600;

            transition:
                .15s ease;
        }

        .filter-bar a.active,
        .filter-bar a:hover {

            border-color:
                var(--accent);

            color:
                var(--text);

            background:
                rgba(110, 231, 183, .08);
        }


        /* =========================================================
           PROGRESS
        ========================================================= */

        .progress-bar {

            height:
                6px;

            background:
                var(--surface2);

            border-radius:
                100px;

            overflow:
                hidden;
        }

        .progress-bar-fill {

            height:
                100%;

            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    var(--accent2)
                );

            border-radius:
                100px;

            transition:
                .3s;
        }


        /* =========================================================
           SECTION HEAD
        ========================================================= */

        .section-head {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                16px;
        }

        .section-head h2 {

            font-size:
                1.05rem;
        }


        /* =========================================================
           TIMETABLE
        ========================================================= */

        .timetable-grid {

            display:
                grid;

            grid-template-columns:
                80px repeat(7, 1fr);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            overflow:
                hidden;
        }

        .tg-cell {

            padding:
                10px 8px;

            border-right:
                1px solid var(--border);

            border-bottom:
                1px solid var(--border);

            font-size:
                .78rem;
        }

        .tg-header {

            background:
                var(--surface2);

            font-family:
                var(--font);

            font-weight:
                700;

            font-size:
                .72rem;

            text-transform:
                none;

            letter-spacing:
                .06em;

            color:
                var(--muted);

            padding:
                10px 8px;

            text-align:
                center;
        }

        .tg-entry {

            background:
                linear-gradient(
                    135deg,
                    rgba(110, 231, 183, .1),
                    rgba(129, 140, 248, .08)
                );

            border:
                1px solid
                rgba(110, 231, 183, .2);

            border-radius:
                6px;

            padding:
                6px 8px;

            margin:
                3px 0;
        }

        .tg-entry-online {

            background:
                linear-gradient(
                    135deg,
                    rgba(52, 211, 153, .1),
                    rgba(52, 211, 153, .05)
                );

            border-color:
                rgba(52, 211, 153, .3);
        }

        .tg-entry-physical {

            background:
                linear-gradient(
                    135deg,
                    rgba(167, 139, 250, .1),
                    rgba(167, 139, 250, .05)
                );

            border-color:
                rgba(167, 139, 250, .3);
        }

        .week-label {

            background:
                var(--surface2);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius-sm);

            padding:
                6px 14px;

            font-size:
                .8rem;

            color:
                var(--muted);

            font-family:
                var(--font);

            font-weight:
                600;
        }


        /* =========================================================
           THEME TOGGLE
        ========================================================= */

        .theme-toggle {

            width:
                34px;

            height:
                34px;

            border-radius:
                50%;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            box-shadow:
                var(--shadow);

            font-size:
                1.15rem;

            color:
                var(--text);

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .15s ease,
                color .15s ease;
        }

        .theme-toggle:hover {

            transform:
                translateY(-2px);

            border-color:
                var(--accent);

            color:
                var(--accent);
        }


        /* =========================================================
           SIDEBAR COLLAPSE TOGGLE
        ========================================================= */

        .sidebar-collapse-btn {

            position:
                fixed;

            top:
                24px;

            left:
                calc(var(--sidebar-w) - 12px);

            z-index:
                150;

            width:
                24px;

            height:
                24px;

            border-radius:
                50%;

            background:
                #1a1e28;

            border:
                1px solid #252a38;

            color:
                #e2e8f0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            font-size:
                .7rem;

            line-height:
                1;

            transition:
                left .2s ease,
                transform .2s ease,
                background .15s ease;
        }

        .sidebar-collapse-btn:hover {

            background:
                #252a38;

            color:
                var(--accent);
        }

        body.sidebar-collapsed .sidebar-collapse-btn {

            left:
                calc(var(--sidebar-w-collapsed) - 12px);

            transform:
                rotate(180deg);
        }


        /* =========================================================
           RESPONSIVENESS
        ========================================================= */

        @media (max-width: 900px) {

            .sidebar {

                width:
                    var(--sidebar-w);
            }

            .main-content {

                margin-left:
                    0;
            }

            .sidebar-collapse-btn {

                display:
                    none;
            }

            .page-body {

                padding:
                    24px 20px;
            }

            .form-row {

                grid-template-columns:
                    1fr;
            }

            .grid-3 {

                grid-template-columns:
                    1fr 1fr;
            }
        }


        @media (max-width: 600px) {

            html {

                font-size:
                    14px;
            }

            .top-bar {

                padding:
                    0 15px;
            }

            .page-body {

                padding:
                    20px 14px;
            }

            .page-title {

                font-size:
                    1.4rem;
            }

            .stat-grid {

                grid-template-columns:
                    1fr 1fr;

                gap:
                    10px;
            }

            .stat-card {

                padding:
                    15px;
            }

            .stat-value {

                font-size:
                    1.6rem;
            }

            .grid-2,
            .grid-3 {

                grid-template-columns:
                    1fr;
            }

            .card {

                padding:
                    16px;
            }

            .section-head {

                align-items:
                    flex-start;

                gap:
                    10px;
            }

            .form-actions {

                flex-wrap:
                    wrap;
            }

            .theme-toggle {

                width:
                    32px;

                height:
                    32px;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                transition:
                    none !important;

                animation:
                    none !important;

                scroll-behavior:
                    auto !important;
            }
        }

    </style>

    {% block extra_style %}{% endblock %}

</head>


<body>

    <!--
        Runs before paint to avoid a flash
        of the wrong theme / sidebar state.
    -->

    <script>

        (function() {

            if (
                localStorage.getItem('theme') === 'light'
            ) {

                document.documentElement
                    .setAttribute(
                        'data-theme',
                        'light'
                    );
            }


            if (
                localStorage.getItem(
                    'sidebarCollapsed'
                ) === 'true'
            ) {

                document.body
                    .classList.add(
                        'sidebar-collapsed'
                    );
            }

        })();

    </script>


    {% block body %}

    <div class="app-layout">

        {% block sidebar %}{% endblock %}

        <div class="main-content">

            {% block topbar %}{% endblock %}

            <div class="page-body">

                {% if messages %}

                    <div class="messages">

                        {% for msg in messages %}

                            <div class="message {{ msg.tags }}">
                                {{ msg }}
                            </div>

                        {% endfor %}

                    </div>

                {% endif %}

                {% block content %}{% endblock %}

            </div>

        </div>

    </div>

    {% endblock %}


    <!-- =========================================================
         SIDEBAR COLLAPSE BUTTON
    ========================================================= -->

    <button
        type="button"
        class="sidebar-collapse-btn"
        id="sidebarCollapseBtn"
        title="Collapse / expand sidebar"
        aria-label="Toggle sidebar">

        ‹

    </button>


    <!-- =========================================================
         JAVASCRIPT
         (theme-toggle button now lives in each page's top bar —
         see admin/base.html and tutor/base.html)
    ========================================================= -->

    <script>

        (function() {

            var html =
                document.documentElement;

            var icon =
                document.getElementById(
                    'themeIcon'
                );

            var themeBtn =
                document.getElementById(
                    'themeToggle'
                );


            /* -----------------------------------------
               THEME ICON
            ----------------------------------------- */

            function updateThemeIcon() {

                var isLight =
                    html.getAttribute(
                        'data-theme'
                    ) === 'light';

                icon.textContent =
                    isLight ? '☾' : '☀';
            }


            updateThemeIcon();


            /* -----------------------------------------
               THEME SWITCH
            ----------------------------------------- */

            themeBtn.addEventListener(
                'click',
                function() {

                    var isLight =
                        html.getAttribute(
                            'data-theme'
                        ) === 'light';


                    if (isLight) {

                        html.removeAttribute(
                            'data-theme'
                        );

                        localStorage.setItem(
                            'theme',
                            'dark'
                        );

                    } else {

                        html.setAttribute(
                            'data-theme',
                            'light'
                        );

                        localStorage.setItem(
                            'theme',
                            'light'
                        );

                    }


                    updateThemeIcon();

                }
            );


            /* -----------------------------------------
               SIDEBAR COLLAPSE
            ----------------------------------------- */

            var collapseBtn =
                document.getElementById(
                    'sidebarCollapseBtn'
                );


            collapseBtn.addEventListener(
                'click',
                function() {

                    var collapsed =
                        document.body.classList.toggle(
                            'sidebar-collapsed'
                        );


                    localStorage.setItem(
                        'sidebarCollapsed',
                        collapsed
                            ? 'true'
                            : 'false'
                    );

                }
            );

        })();

    </script>

</body>

</html>
