<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Paarch ICT ACademy{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #13161d;
  --surface2: #1a1e28;
  --border: #252a38;
  --accent: #6ee7b7;
  --accent2: #818cf8;
  --accent3: #fb923c;
  --warn: #f87171;
  --text: #e2e8f0;
  --muted: #64748b;
  --online: #34d399;
  --physical: #a78bfa;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,h5{font-family:'Syne',sans-serif;font-weight:700;line-height:1.2}

/* Layout */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:240px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.main-content{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.top-bar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
.page-body{padding:28px;flex:1}

/* Sidebar */
.sidebar-logo{padding:20px 20px 12px;border-bottom:1px solid var(--border)}
.sidebar-logo .logo-text{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-logo .logo-sub{font-size:.7rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
.sidebar-nav{padding:12px 10px;flex:1}
.nav-section{margin-bottom:16px}
.nav-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:0 10px 6px;font-family:'Syne',sans-serif}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:.88rem;font-weight:500;transition:.15s;cursor:pointer;margin-bottom:2px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(110,231,183,.15),rgba(129,140,248,.1));color:var(--accent);border:1px solid rgba(110,231,183,.2)}
.nav-item .icon{width:16px;text-align:center;font-size:.95rem}
.sidebar-footer{padding:14px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);background:var(--surface2)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;color:#000;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.7rem;color:var(--muted)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;inset:0;opacity:.04;background:var(--glow-color,var(--accent));border-radius:inherit}
.stat-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.stat-value{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-sub{font-size:.75rem;color:var(--muted);margin-top:4px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:600;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:.05em}
.badge-online{background:rgba(52,211,153,.15);color:var(--online);border:1px solid rgba(52,211,153,.25)}
.badge-physical{background:rgba(167,139,250,.15);color:var(--physical);border:1px solid rgba(167,139,250,.25)}
.badge-present{background:rgba(110,231,183,.15);color:var(--accent);border:1px solid rgba(110,231,183,.25)}
.badge-absent{background:rgba(248,113,113,.15);color:var(--warn);border:1px solid rgba(248,113,113,.25)}
.badge-draft{background:rgba(100,116,139,.15);color:var(--muted);border:1px solid rgba(100,116,139,.25)}
.badge-submitted{background:rgba(251,146,60,.15);color:var(--accent3);border:1px solid rgba(251,146,60,.25)}
.badge-reviewed{background:rgba(110,231,183,.15);color:var(--accent);border:1px solid rgba(110,231,183,.25)}
.badge-active{background:rgba(110,231,183,.12);color:var(--accent);border:1px solid rgba(110,231,183,.2)}
.badge-inactive{background:rgba(248,113,113,.12);color:var(--warn);border:1px solid rgba(248,113,113,.2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-family:'Syne',sans-serif;font-size:.82rem;font-weight:600;border:none;cursor:pointer;transition:.15s;text-decoration:none;letter-spacing:.02em}
.btn-primary{background:linear-gradient(135deg,var(--accent),#34d399);color:#000}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--warn);border:1px solid rgba(248,113,113,.25)}
.btn-danger:hover{background:rgba(248,113,113,.25)}
.btn-sm{padding:5px 11px;font-size:.76rem}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--muted)}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{background:var(--surface2);color:var(--muted);font-family:'Syne',sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:12px 16px;text-align:left;font-weight:600;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

/* Forms */
.form-wrap{max-width:640px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-family:'Syne',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,231,183,.1)}
textarea{resize:vertical;min-height:80px}
.checkbox-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.checkbox-list label{display:flex;align-items:center;gap:8px;font-size:.875rem;cursor:pointer;padding:3px 0}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-actions{display:flex;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}

/* Messages */
.messages{margin-bottom:18px}
.message{padding:10px 16px;border-radius:var(--radius-sm);font-size:.875rem;margin-bottom:6px;border-left:3px solid}
.message.success{background:rgba(110,231,183,.1);border-color:var(--accent);color:var(--accent)}
.message.error{background:rgba(248,113,113,.1);border-color:var(--warn);color:var(--warn)}
.message.warning{background:rgba(251,146,60,.1);border-color:var(--accent3);color:var(--accent3)}

/* Misc */
.page-title{font-size:1.6rem;font-weight:800;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:.875rem;margin-bottom:24px}
.flex{display:flex}.flex-1{flex:1}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.text-muted{color:var(--muted)}.text-sm{font-size:.82rem}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--online)}.dot-purple{background:var(--physical)}.dot-gray{background:var(--muted)}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:.72rem;color:var(--muted)}
.empty-state{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-state .icon{font-size:2.5rem;margin-bottom:12px}
.empty-state p{font-size:.9rem}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar a{padding:6px 14px;border-radius:100px;border:1px solid var(--border);font-size:.8rem;color:var(--muted);font-family:'Syne',sans-serif;font-weight:600}
.filter-bar a.active,.filter-bar a:hover{border-color:var(--accent);color:var(--accent);background:rgba(110,231,183,.08)}
.progress-bar{height:6px;background:var(--surface2);border-radius:100px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:100px;transition:.3s}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-head h2{font-size:1.05rem}
.timetable-grid{display:grid;grid-template-columns:80px repeat(7,1fr);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tg-cell{padding:10px 8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:.78rem}
.tg-header{background:var(--surface2);font-family:'Syne',sans-serif;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px;text-align:center}
.tg-entry{background:linear-gradient(135deg,rgba(110,231,183,.1),rgba(129,140,248,.08));border:1px solid rgba(110,231,183,.2);border-radius:6px;padding:6px 8px;margin:3px 0}
.tg-entry-online{background:linear-gradient(135deg,rgba(52,211,153,.1),rgba(52,211,153,.05));border-color:rgba(52,211,153,.3)}
.tg-entry-physical{background:linear-gradient(135deg,rgba(167,139,250,.1),rgba(167,139,250,.05));border-color:rgba(167,139,250,.3)}
.week-label{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;font-size:.8rem;color:var(--muted);font-family:'Syne',sans-serif;font-weight:600}
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
{% block body %}
<div class="app-layout">
  {% block sidebar %}{% endblock %}
  <div class="main-content">
    {% block topbar %}{% endblock %}
    <div class="page-body">
      {% if messages %}
      <div class="messages">
        {% for msg in messages %}
        <div class="message {{ msg.tags }}">{{ msg }}</div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
</body>
</html>
