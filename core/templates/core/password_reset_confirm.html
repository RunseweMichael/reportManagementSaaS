{% extends "core/base.html" %}

{% block title %}Set New Password - Parach ICT Academy{% endblock %}

{% block extra_style %}
<style>
    .password-reset-page {
        min-height: calc(100vh - 60px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .password-reset-card {
        width: 100%;
        max-width: 450px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 36px;
        box-shadow: var(--shadow);
    }

    .reset-icon {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(129, 140, 248, 0.12);
        border: 1px solid rgba(129, 140, 248, 0.3);

        color: var(--accent2);
        font-size: 1.5rem;
    }

    .reset-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .reset-header h2 {
        font-size: 1.5rem;
        margin-bottom: 10px;
    }

    .reset-header p {
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.6;
    }

    .password-reset-form p {
        margin-bottom: 18px;
    }

    .password-reset-form label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 7px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .password-reset-form input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 11px 13px;

        color: var(--text);
        font-family: var(--font);
        font-size: 0.9rem;

        outline: none;
        transition: 0.15s;
    }

    .password-reset-form input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.1);
    }

    .password-reset-form .helptext {
        display: block;
        color: var(--muted);
        font-size: 0.73rem;
        line-height: 1.5;
        margin-top: 6px;
    }

    .password-reset-form ul {
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.5;
        margin: 8px 0 0 18px;
    }

    .password-reset-form .errorlist {
        color: var(--warn);
        font-size: 0.78rem;
        list-style: none;
        margin: 6px 0;
    }

    .password-reset-form button {
        width: 100%;
        justify-content: center;
        margin-top: 8px;
    }
</style>
{% endblock %}


{% block content %}

<div class="password-reset-page">

    <div class="password-reset-card">

        <div class="reset-icon">
            🔑
        </div>

        <div class="reset-header">
            <h2>Set New Password</h2>

            <p>
                Create a new password for your Tutor Management System
                account.
            </p>
        </div>

        <form method="POST" class="password-reset-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Change Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
